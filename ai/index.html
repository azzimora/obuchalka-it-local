<script>
  function refreshToc() {
    let done = 0;
    document.querySelectorAll(".toc-item").forEach(el => {
      const id = el.dataset.lesson;
      const d = state.lessons[id];
      if (d && d.done) {
        el.classList.add("done");
        done++;
      } else if (d && hasContent(d)) {
        el.classList.add("progress");
      }
    });
    updateProgressOnToc(8, done);
  }
  refreshToc();
